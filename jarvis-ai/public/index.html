<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS | Streetwise Connection</title><style>body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui}main{max-width:720px;margin:auto;padding:24px}h1{letter-spacing:.15em;color:#76dcff}section{background:#171e32;border:1px solid #34405b;border-radius:16px;padding:20px;margin:16px 0}textarea{width:100%;box-sizing:border-box;background:#0b1020;color:white;border:1px solid #56617a;border-radius:8px;padding:12px;min-height:100px}button{background:#66d7ff;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;margin-top:12px;cursor:pointer}pre{white-space:pre-wrap;font:inherit}small{color:#b4c2d7}</style></head><body><main><h1>JARVIS AI</h1><p><a href="/investigator.html" style="color:#76dcff">Open Investigator case dashboard →</a></p><p>Streetwise Connection • Private-use prototype</p><section><strong>Approval mode: ON</strong><p><small>This prototype only generates text. It cannot send messages, make payments, edit videos, or execute external actions.</small></p></section><section><label for="prompt">Ask JARVIS</label><textarea id="prompt" placeholder="Build a promotion plan for my next music video"></textarea><button id="ask">Ask JARVIS</button><pre id="reply" aria-live="polite">Ready.</pre></section><section><strong>Session history</strong><div id="history"><small>No requests yet.</small></div></section></main><script>const b=document.getElementById('ask'),p=document.getElementById('prompt'),r=document.getElementById('reply'),h=document.getElementById('history');b.onclick=async()=>{const message=p.value.trim();if(!message)return;b.disabled=true;r.textContent='Working…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});const data=await response.json();r.textContent=data.answer||data.error||'No response';if(response.ok){if(h.querySelector('small'))h.textContent='';const el=document.createElement('p');el.textContent='Draft completed: '+message.slice(0,100);h.prepend(el)}}catch{r.textContent='Could not connect to server.'}finally{b.disabled=false}};</script></body></html>
