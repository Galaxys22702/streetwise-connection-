services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streetwise
      POSTGRES_USER: streetwise
      POSTGRES_PASSWORD: streetwise_dev
    ports:
      - "5432:5432"
    volumes:
      - streetwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetwise -d streetwise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  streetwise_pgdata:
