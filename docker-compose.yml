services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streetwise
      POSTGRES_USER: streetwise
      POSTGRES_PASSWORD: streetwise_dev
    ports:
      - "5432:5432"
    volumes:
      - streetwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U streetwise -d streetwise -tAc 'SELECT 1' | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  streetwise_pgdata:
