limit_req_zone $binary_remote_addr zone=streetwise_api:10m rate=15r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.streetwiseconnection.com;
    location /.well-known/acme-challenge/ { root /var/www/streetwise-acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.streetwiseconnection.com;
    ssl_certificate /etc/letsencrypt/live/api.streetwiseconnection.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.streetwiseconnection.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    access_log off;
    location / {
        limit_req zone=streetwise_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name turn.streetwiseconnection.com;
    location /.well-known/acme-challenge/ { root /var/www/streetwise-acme; }
    location / { return 404; }
}
