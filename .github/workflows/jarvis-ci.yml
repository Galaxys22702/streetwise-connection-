name: Jarvis CI

on:
  push:
    branches:
      - "jarvis/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  jarvis-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jarvis test suite
        run: node --test test/jarvis.test.js test/jarvis.integration.test.js test/jarvis-commerce.test.js test/jarvis-operations.test.js
