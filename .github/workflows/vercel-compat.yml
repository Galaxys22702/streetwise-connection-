name: Vercel compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check Vercel configuration
        run: node scripts/vercel-config-check.js

      - name: Check application syntax
        run: |
          node --check 'api/[...path].js'
          node --check public/app.js
          node --check src/providers/stripePaymentProvider.js

      - name: Build Vercel static output
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R public/. dist/
          test -f dist/index.html
          test -f dist/app.js
