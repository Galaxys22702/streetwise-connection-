name: Vercel compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check Vercel configuration
        run: node scripts/vercel-config-check.js

      - name: Check application syntax
        run: |
          node --check 'api/[...path].js'
          node --check public/app.js
          node --check src/providers/stripePaymentProvider.js

      - name: Build Vercel static output
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R public/. dist/
          test -f dist/index.html
          test -f dist/app.js
