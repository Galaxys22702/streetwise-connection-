name: Sync Main Ruleset

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview drift only. Turn OFF to apply .github/main-ruleset.json to GitHub."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-main-ruleset
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Protect main ruleset
    runs-on: ubuntu-latest

    environment:
      name: repository-administration

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate desired ruleset JSON
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .name == "Protect main" and
            .target == "branch" and
            .enforcement == "active" and
            (.conditions.ref_name.include | index("refs/heads/main")) != null
          ' .github/main-ruleset.json >/dev/null

      - name: Compare live ruleset with repository policy
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
          RULESET_ID: "23781049"
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RULESET_ADMIN_TOKEN is not configured."
            exit 1
          fi

          live="$(mktemp)"
          desired="$(mktemp)"

          curl --fail-with-body --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}"             > "${live}"

          jq '{
            name,
            target,
            enforcement,
            bypass_actors,
            conditions,
            rules
          }' "${live}" | jq -S . > "${live}.normalized"

          jq -S . .github/main-ruleset.json > "${desired}"

          echo "## Main ruleset sync" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"

          if diff -u "${live}.normalized" "${desired}" > ruleset.diff; then
            echo "drift=false" >> "${GITHUB_OUTPUT}"
            echo "Live ruleset already matches .github/main-ruleset.json." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "drift=true" >> "${GITHUB_OUTPUT}"
            echo "Ruleset drift detected." >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~diff' >> "${GITHUB_STEP_SUMMARY}"
            cat ruleset.diff >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Apply repository ruleset policy
        if: ${{ steps.compare.outputs.drift == 'true' && inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
          RULESET_ID: "23781049"
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error             -X PUT             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             -H "Content-Type: application/json"             --data-binary @.github/main-ruleset.json             "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}"             > updated-ruleset.json

          echo "Applied .github/main-ruleset.json to live ruleset ${RULESET_ID}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "Dry run is ON. No repository rule was changed." >> "${GITHUB_STEP_SUMMARY}"
