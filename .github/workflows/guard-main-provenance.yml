name: Guard main provenance

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: guard-main-provenance
  cancel-in-progress: false

jobs:
  verify-main-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify push came from merged pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: node scripts/guard-main-provenance.js
