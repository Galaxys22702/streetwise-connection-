name: Clean merged branches

on:
  # Preview after merges land, then apply only after a cooling-off period.
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete qualifying branches (false previews only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deletion uses an exact-SHA lease and needs Git authentication.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Preview or clean unchanged merged branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEANUP_MIN_AGE_DAYS: "7"
          APPLY_CLEANUP: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: |
          if [ "$APPLY_CLEANUP" = "true" ]; then
            node scripts/cleanup-merged-branches.js --apply
          else
            node scripts/cleanup-merged-branches.js
          fi
