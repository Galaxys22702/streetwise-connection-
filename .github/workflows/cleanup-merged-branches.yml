name: Clean merged branches

on:
  # Preview on pushes and schedules. Delete only after manual approval.
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete one expressly approved branch (false previews only)
        type: boolean
        default: false
      branch:
        description: Exact approved branch name (required when apply is true)
        type: string
        default: ""
      expected_sha:
        description: Exact 40-character head SHA (required when apply is true)
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.apply)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Preview unchanged merged branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEANUP_MIN_AGE_DAYS: "30"
        run: node scripts/cleanup-merged-branches.js

  cleanup:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.apply
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deletion uses an exact-SHA lease and needs Git authentication.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Delete only unchanged eligible branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEANUP_MIN_AGE_DAYS: "30"
          CLEANUP_APPROVED_BRANCH: ${{ inputs.branch }}
          CLEANUP_APPROVED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/cleanup-merged-branches.js --apply
