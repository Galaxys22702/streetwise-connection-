name: Build targets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run full repository verification
        run: npm run verify

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build builder target
        run: docker build --target builder -t streetwise-connection:builder .

      - name: Build production target
        run: docker build --target production -t streetwise-connection:production .

      - name: Smoke test database startup and production container
        run: |
          set -euo pipefail

          docker network create streetwise-test
          docker run -d --name streetwise-postgres --network streetwise-test \
            -e POSTGRES_DB=streetwise \
            -e POSTGRES_USER=streetwise \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16-alpine

          cleanup() {
            docker logs streetwise-smoke 2>/dev/null || true
            docker logs streetwise-postgres 2>/dev/null || true
            docker rm -f streetwise-smoke streetwise-postgres 2>/dev/null || true
            docker network rm streetwise-test 2>/dev/null || true
          }
          trap cleanup EXIT

          database_ready=false
          for i in $(seq 1 30); do
            if docker exec streetwise-postgres \
              psql -U streetwise -d streetwise -tAc 'SELECT 1' 2>/dev/null | grep -qx '1'; then
              database_ready=true
              break
            fi
            sleep 1
          done

          if [ "$database_ready" != "true" ]; then
            echo "Target PostgreSQL database did not become queryable" >&2
            exit 1
          fi

          DATABASE_URL='postgres://streetwise@streetwise-postgres:5432/streetwise'

          docker run --rm --network streetwise-test \
            -e DATABASE_URL="$DATABASE_URL" \
            streetwise-connection:production node scripts/migrate.js

          docker run -d --name streetwise-smoke --network streetwise-test -p 3000:3000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PUBLIC_LAUNCH_MODE=waitlist \
            -e WAITLIST_ENABLED=false \
            -e PAYMENT_PROVIDER=mock \
            -e ESIM_PROVIDER=mock \
            streetwise-connection:production

          app_ready=false
          for i in $(seq 1 30); do
            HEALTH=$(curl --silent --fail http://127.0.0.1:3000/health 2>/dev/null || true)
            if echo "$HEALTH" | grep -q '"ok":true'; then
              app_ready=true
              break
            fi
            sleep 1
          done

          if [ "$app_ready" != "true" ]; then
            echo "Application did not become ready in fail-closed waitlist mode" >&2
            exit 1
          fi

          PROVIDER_STATUS=$(curl --silent --write-out '\n%{http_code}' http://127.0.0.1:3000/api/provider/status)
          PROVIDER_BODY=$(printf '%s\n' "$PROVIDER_STATUS" | sed '$d')
          PROVIDER_CODE=$(printf '%s\n' "$PROVIDER_STATUS" | tail -n 1)
          test "$PROVIDER_CODE" = "503"
          echo "$PROVIDER_BODY" | grep '"error":"public_waitlist_only"'

          HEADERS=$(curl --silent --head http://127.0.0.1:3000/ | tr -d '\r')
          echo "$HEADERS" | grep -qi '^content-security-policy:'
          echo "$HEADERS" | grep -qi '^x-content-type-options: nosniff'
          echo "$HEADERS" | grep -qi '^x-frame-options: DENY'
          echo "$HEADERS" | grep -qi '^referrer-policy: no-referrer'
          echo "$HEADERS" | grep -qi '^strict-transport-security: max-age=63072000; includeSubDomains; preload$'
