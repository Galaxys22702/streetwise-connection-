name: Stripe test validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/providers/stripePaymentProvider.js"
      - "src/services/paymentService.js"
      - "src/config/env.js"
      - "src/config/plans.js"
      - "test/payment-service.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stripe-test-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/providers/stripePaymentProvider.js"
      - "src/services/paymentService.js"
      - "src/config/env.js"
      - "src/config/plans.js"
      - "test/payment-service.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stripe-test-validation.yml"

permissions:
  contents: read

concurrency:
  group: stripe-test-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stripe-test-connection:
    # External forks and Dependabot PRs do not receive repository secrets. Skip
    # the live Stripe test connection there instead of producing a false failure.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_LIVE_MODE_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require Stripe test secret
        run: |
          test -n "$STRIPE_SECRET_KEY"
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "Only a Stripe test secret (sk_test_...) is permitted." >&2; exit 1 ;;
          esac

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Verify Streetwise Stripe safety state
        run: |
          node --input-type=module <<'NODE'
          import { stripeStatus } from './src/providers/stripePaymentProvider.js';

          const status = stripeStatus();
          if (!status.configured) throw new Error('stripe_not_configured');
          if (status.keyMode !== 'test') throw new Error(`unexpected_key_mode:${status.keyMode}`);
          if (status.liveModeEnabled) throw new Error('stripe_live_mode_must_remain_disabled');

          console.log('Streetwise Stripe configuration is test-only and live mode is disabled.');
          NODE

      - name: Verify Stripe API connection
        run: |
          node --input-type=module <<'NODE'
          import Stripe from 'stripe';

          const stripe = new Stripe(process.env.STRIPE_SECRET_KEY, { maxNetworkRetries: 2 });
          const account = await stripe.accounts.retrieve();
          if (!account?.id) throw new Error('stripe_account_not_returned');
          console.log('Stripe test API connection verified successfully.');
          NODE
