name: Facebook ops heartbeat

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facebook-ops-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check Facebook operations
        env:
          FACEBOOK_OPS_BASE_URL: https://streetwise-connection.vercel.app
          FACEBOOK_OPS_ADMIN_KEY: ${{ secrets.META_ADMIN_API_KEY }}
        run: node scripts/facebook-ops-heartbeat.js
