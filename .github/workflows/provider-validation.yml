name: Provider validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/providers/**"
      - "src/services/esimService.js"
      - "src/services/esimWebhookService.js"
      - "src/config/env.js"
      - "src/config/launchMode.js"
      - "src/config/plans.js"
      - "src/server.js"
      - "scripts/esim-go-validation-diagnostics.js"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/provider-validation.yml"

permissions:
  contents: read

concurrency:
  group: provider-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esim-go-connection:
    # Credentialed checks run only on main; pull requests use the mock/unit suite.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ESIM_API_KEY: ${{ secrets.ESIM_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify API secret is configured
        run: test -n "$ESIM_API_KEY"

      - name: Classify provider validation readiness without exposing account amounts
        run: node scripts/esim-go-validation-diagnostics.js

      - name: Build production image
        run: docker build --target production -t streetwise-connection:provider-test .

      - name: Verify eSIM Go connection catalogue quote and live-order safety
        run: |
          # The production image normally runs scripts/start.js, which intentionally
          # requires DATABASE_URL for hosted commercial service migrations. Provider
          # validation is read-only/validation-only and needs no customer database,
          # so override the command and start only the HTTP server here.
          docker run -d --name streetwise-provider-test -p 3001:3000 \
            -e PUBLIC_LAUNCH_MODE=internal \
            -e ESIM_PROVIDER=esim-go \
            -e ESIM_API_KEY="$ESIM_API_KEY" \
            -e ESIM_LIVE_ORDERS_ENABLED=false \
            -e PAYMENT_PROVIDER=mock \
            streetwise-connection:provider-test \
            node src/server.js

          trap 'docker logs streetwise-provider-test 2>/dev/null || true; docker rm -f streetwise-provider-test 2>/dev/null || true' EXIT

          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:3001/api/provider/status >/dev/null; then
              break
            fi
            sleep 1
          done

          STATUS=$(curl --fail --silent http://127.0.0.1:3001/api/provider/status)
          echo "$STATUS" | jq -e '.provider == "esim-go"'
          echo "$STATUS" | jq -e '.configured == true'
          echo "$STATUS" | jq -e '.liveOrdersEnabled == false'

          CATALOGUE=$(curl --fail --silent 'http://127.0.0.1:3001/api/provider/catalogue?country=US')
          BUNDLE_COUNT=$(echo "$CATALOGUE" | jq '.bundles | length')
          test "$BUNDLE_COUNT" -gt 0

          CANDIDATE='esim_3GB_30D_US_V2'
          echo "$CATALOGUE" | jq -e --arg name "$CANDIDATE" '.bundles | any(.name == $name)'

          VALIDATION=$(curl --fail --silent \
            -X POST http://127.0.0.1:3001/api/esims/order \
            -H 'Content-Type: application/json' \
            -d "{\"bundleName\":\"$CANDIDATE\",\"quantity\":1,\"country\":\"US\",\"device\":\"iPhone 15\",\"validateOnly\":true}")

          echo "$VALIDATION" | jq -e '.safety.liveOrderExecuted == false'
          ORDER_STATUS=$(echo "$VALIDATION" | jq -r '.order.status // "unknown"')
          QUOTED_TOTAL=$(echo "$VALIDATION" | jq -r '.order.total // "unknown"')
          QUOTED_CURRENCY=$(echo "$VALIDATION" | jq -r '.order.currency // "unknown"')
          test "$QUOTED_TOTAL" != "unknown"
          test "$QUOTED_CURRENCY" = "USD"

          MAX_PROVIDER_COST_USD='6'
          awk -v quoted="$QUOTED_TOTAL" -v max="$MAX_PROVIDER_COST_USD" 'BEGIN { exit !(quoted <= max) }'

          echo "eSIM Go API connection verified. U.S. catalogue bundles: $BUNDLE_COUNT"
          echo "Starter candidate: $CANDIDATE"
          echo "Provider validation response: $ORDER_STATUS"
          echo "Quoted provider total: $QUOTED_TOTAL $QUOTED_CURRENCY"
          echo "Wholesale screening guardrail: <= $MAX_PROVIDER_COST_USD USD"
          echo "A quote is not an accepted order validation; the readiness diagnostic above controls that distinction."
          echo "Live ordering remained disabled throughout this test."
